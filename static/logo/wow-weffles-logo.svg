<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" role="img" aria-label="Wow Weffles">
  <defs>
    <linearGradient id="ww-waffle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4BC6B"/>
      <stop offset="1" stop-color="#D98E3D"/>
    </linearGradient>
  </defs>
  <!-- Waffle icon -->
  <g transform="translate(0, 4)">
    <!-- Steam -->
    <g fill="none" stroke="#E8720C" stroke-width="2" stroke-linecap="round">
      <path d="M13 2 Q11 4, 13 6" opacity="0.7"/>
      <path d="M19 2 Q17 4, 19 6" opacity="0.7"/>
    </g>
    <!-- Waffle square -->
    <rect x="4" y="8" width="28" height="28" rx="7" fill="url(#ww-waffle)"/>
    <rect x="4" y="8" width="28" height="28" rx="7" fill="none" stroke="#B4712C" stroke-width="0.7" opacity="0.5"/>
    <!-- Grid pattern -->
    <g stroke="#8B5A2B" stroke-width="1.6" stroke-linecap="round" opacity="0.4">
      <line x1="13" y1="12" x2="13" y2="32"/>
      <line x1="23" y1="12" x2="23" y2="32"/>
      <line x1="8" y1="18" x2="28" y2="18"/>
      <line x1="8" y1="26" x2="28" y2="26"/>
    </g>
    <!-- Center dot -->
    <circle cx="18" cy="22" r="2" fill="#E8720C" opacity="0.8"/>
  </g>
  <!-- Text "Wow Weffles" -->
  <g transform="translate(46, 0)">
    <text x="0" y="32" font-family="'Fraunces', 'Georgia', serif" font-size="28" font-weight="600" fill="#3A281B" letter-spacing="-0.5">
      <tspan>Wow Weffles</tspan>
    </text>
  </g>
</svg>
