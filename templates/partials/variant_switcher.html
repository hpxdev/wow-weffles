<div class="ww-switch" id="wwSwitch">
  <div class="ww-switch__panel" id="wwSwitchPanel" role="menu" aria-label="Switch design">
    <div class="ww-switch__title">Switch design</div>
    <a class="ww-switch__item" data-key="live" href="/" role="menuitem"><span class="sw sw-live"></span>Live site</a>
    <a class="ww-switch__item" data-key="editorial" href="/variants/editorial/" role="menuitem"><span class="sw sw-ed"></span>Editorial</a>
    <a class="ww-switch__item" data-key="playful" href="/variants/playful/" role="menuitem"><span class="sw sw-pl"></span>Playful</a>
    <a class="ww-switch__item" data-key="premium" href="/variants/premium/" role="menuitem"><span class="sw sw-pr"></span>Premium</a>
    <a class="ww-switch__item" data-key="book" href="/variants/book/" role="menuitem"><span class="sw sw-bk"></span>Storybook</a>
    <a class="ww-switch__item ww-switch__all" data-key="all" href="/variants/" role="menuitem">Compare all →</a>
    <a class="ww-switch__item ww-switch__logo" data-key="logos" href="/logo-selection/" role="menuitem">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      Logo Selection
    </a>
  </div>
  <button class="ww-switch__fab" id="wwSwitchFab" aria-expanded="false" aria-haspopup="true" aria-label="Switch design">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3a9 9 0 1 0 0 18c1.7 0 2-1.3 1.2-2.2-.7-.9-.2-2.1 1-2.1H17a4 4 0 0 0 4-4c0-4.9-4-7.7-9-7.7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="7.5" cy="11.5" r="1.2" fill="currentColor"/><circle cx="12" cy="8" r="1.2" fill="currentColor"/><circle cx="16.5" cy="11.5" r="1.2" fill="currentColor"/>
    </svg>
    <span class="ww-switch__fablabel">Design: <b id="wwSwitchNow">Live</b></span>
  </button>
</div>

<style>
  .ww-switch{position:fixed;right:20px;bottom:20px;z-index:120;font-family:"Manrope",system-ui,-apple-system,sans-serif}
  .ww-switch *{box-sizing:border-box}
  .ww-switch__fab{display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:none;
    background:#E8720C;color:#fff;font-size:.9rem;font-weight:700;padding:.7rem 1.1rem;border-radius:999px;
    box-shadow:0 14px 30px -12px rgba(232,114,12,.85);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s}
  .ww-switch__fab:hover{transform:translateY(-2px)}
  .ww-switch__fablabel{white-space:nowrap}
  .ww-switch__fablabel b{font-weight:800}
  .ww-switch__panel{position:absolute;right:0;bottom:calc(100% + 12px);width:210px;
    background:#FFFDF9;border:1px solid #E7DECF;border-radius:16px;padding:8px;
    box-shadow:0 24px 50px -18px rgba(58,40,27,.5);
    opacity:0;visibility:hidden;transform:translateY(10px) scale(.97);transform-origin:bottom right;
    transition:opacity .2s ease,transform .22s cubic-bezier(.34,1.56,.64,1),visibility .2s}
  .ww-switch.open .ww-switch__panel{opacity:1;visibility:visible;transform:none}
  .ww-switch__title{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A8B79;padding:8px 10px 6px}
  .ww-switch__item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
    font-size:.92rem;font-weight:600;color:#3A281B;text-decoration:none;transition:background .15s}
  .ww-switch__item:hover{background:#F3ECE0}
  .ww-switch__item.active{background:#FBE7D2;color:#B9560A}
  .ww-switch__item.active::after{content:"✓";margin-left:auto;font-weight:800;color:#E8720C}
  .ww-switch__all{justify-content:center;color:#E8720C;font-weight:800;margin-top:4px;border-top:1px solid #EFE6D8;border-radius:0 0 10px 10px}
  .ww-switch__all:hover{background:transparent;text-decoration:underline}
  .ww-switch__logo{justify-content:center;color:#fff;background:#E8720C;font-weight:800;margin-top:4px;border-top:1px solid #EFE6D8;border-radius:10px;padding:10px 12px!important}
  .ww-switch__logo:hover{background:#F79A44}
  .ww-switch__logo svg{width:16px;height:16px;margin-right:6px}
  .ww-switch .sw{width:16px;height:16px;border-radius:5px;flex:none;border:1px solid rgba(58,40,27,.2)}
  .ww-switch .sw-live{background:linear-gradient(135deg,#FAF6EF,#D8C3A5)}
  .ww-switch .sw-ed{background:linear-gradient(135deg,#D8C3A5,#7A7A52)}
  .ww-switch .sw-pl{background:linear-gradient(135deg,#F79A44,#E8720C)}
  .ww-switch .sw-pr{background:linear-gradient(135deg,#5A3E2B,#1E130C)}
  .ww-switch .sw-bk{background:linear-gradient(135deg,#F4EAD5,#D8B98A)}
  @media (max-width:520px){
    .ww-switch__fablabel{display:none}
    .ww-switch__fab{padding:.8rem;width:48px;height:48px;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){
    .ww-switch__fab,.ww-switch__panel{transition:none}
  }
</style>

<script>
  (function(){
    var root=document.getElementById('wwSwitch');
    var fab=document.getElementById('wwSwitchFab');
    var panel=document.getElementById('wwSwitchPanel');
    if(!root||!fab) return;

    // Mark the active design based on the current path.
    var p=location.pathname, key='live', label='Live';
    if(p.indexOf('/variants/editorial')===0){key='editorial';label='Editorial';}
    else if(p.indexOf('/variants/playful')===0){key='playful';label='Playful';}
    else if(p.indexOf('/variants/premium')===0){key='premium';label='Premium';}
    else if(p.indexOf('/variants/book')===0){key='book';label='Storybook';}
    else if(p.indexOf('/variants')===0){key='all';label='Variants';}
    var now=document.getElementById('wwSwitchNow'); if(now) now.textContent=label;
    var active=root.querySelector('.ww-switch__item[data-key="'+key+'"]');
    if(active) active.classList.add('active');

    function open(){root.classList.add('open');fab.setAttribute('aria-expanded','true');}
    function close(){root.classList.remove('open');fab.setAttribute('aria-expanded','false');}
    function toggle(e){e.stopPropagation();root.classList.contains('open')?close():open();}

    fab.addEventListener('click',toggle);
    document.addEventListener('click',function(e){if(!root.contains(e.target))close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  })();
</script>
